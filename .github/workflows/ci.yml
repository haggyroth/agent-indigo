name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Ruff (real errors only)
        run: ruff check .
      - name: Pytest
        # Hardware-free suite; native-binding/ROM tests skip automatically.
        run: python -m pytest

  binding:
    name: build native libmgba binding (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libmgba
        # NOTE (#446): Homebrew's mgba bottle (0.10.5_2) was built against ffmpeg 8 (libavcodec.62) while the runner installs ffmpeg 9.1; the next step links the missing ffmpeg paths to the
        # installed copies so libmgba loads and the binding tests below really run (only the ROM tests skip).
        run: brew install mgba
      - name: Link libmgba's ffmpeg dependencies to the installed ffmpeg (#446)
        # The bottle was linked against an older ffmpeg major than the runner's: every libav*/libsw* path it names that does not exist gets a symlink to the installed copy of the same library, so the
        # dylib loads (libmgba only touches ffmpeg to record video, which the binding never does). Prints what it saw, so a future mismatch is diagnosable from the log.
        run: |
          LIB="$(brew --prefix)/lib/libmgba.dylib"
          echo "--- libmgba's ffmpeg dependencies"; otool -L "$LIB" | grep -E "lib(av|sw)" || true
          for dep in $(otool -L "$LIB" | awk '/lib(av|sw)[a-z]*\.[0-9]+\.dylib/ {print $1}'); do
            if [ ! -e "$dep" ]; then
              base="$(basename "$dep" | sed -E 's/\.[0-9]+\.dylib$//')"
              have="$(ls "$(dirname "$dep")/$base".*.dylib 2>/dev/null | head -n 1 || true)"
              echo "missing $dep -> ${have:-nothing installed}"
              if [ -n "$have" ]; then ln -s "$have" "$dep"; fi
            fi
          done
          echo "--- after"; otool -L "$LIB" | grep -E "lib(av|sw)" | while read -r dep _; do [ -e "$dep" ] && echo "ok $dep" || echo "STILL MISSING $dep"; done
      - name: Install build + test dependencies
        run: pip install cffi setuptools -r requirements-test.txt
      - name: Build the cffi binding
        # Point the builder at Homebrew's prefix (works on both ARM and Intel runners).
        run: MGBA_PREFIX="$(brew --prefix)" python -m game._mgba_build
      - name: Build the two-core link module (prototype, #363)
        # Compiles against libmgba's internal SIO lockstep headers: catches a Homebrew upgrade that moves them.
        run: MGBA_PREFIX="$(brew --prefix)" python -m game._mgba_link_build
      - name: The compiled extensions must import (a silent skip hid a broken import for weeks, #446)
        run: python -c "import game._mgba_native, game._mgba_link; print('both compiled extensions import')"
      - name: Pytest (binding symbol checks; ROM tests skip)
        # ROM is copyrighted and never present in CI, so load/framebuffer tests
        # skip; the symbol test confirms the binding compiled and imports.
        run: python -m pytest tests/test_binding.py -v -rs
